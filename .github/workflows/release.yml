name: Release

# Pushing a tag such as 1.3.0 (or 1.3.0-preview.1) builds the plugin and
# creates a draft GitHub release with the three files Obsidian and BRAT need.
# Write the release notes on the draft, then publish it.
on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          manifest_version=$(node -p 'require("./manifest.json").version')
          package_version=$(node -p 'require("./package.json").version')
          if [ "$TAG" != "$manifest_version" ] || [ "$TAG" != "$package_version" ]; then
            echo "::error::Tag $TAG does not match manifest.json ($manifest_version) and package.json ($package_version)"
            exit 1
          fi
          # A community release (no suffix) needs a versions.json entry
          case "$TAG" in
            *-*) ;;
            *)
              if ! node -e 'process.exit(require("./versions.json")[process.argv[1]] ? 0 : 1)' "$TAG"; then
                echo "::error::versions.json has no entry for $TAG"
                exit 1
              fi
              ;;
          esac

      - name: Test
        run: pnpm test -- --run

      - name: Build
        run: pnpm build

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$TAG" main.js manifest.json styles.css \
            --draft $prerelease --verify-tag --title "$TAG" \
            --notes "Write the release notes here, then publish."
